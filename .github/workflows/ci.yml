name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    name: Build & Test
    # macos-26 is the runner image carrying Xcode 26.x (Swift 6.3+). Its default
    # Xcode already matches .swift-version, but we select explicitly below so CI
    # stays deterministic as the image's default drifts.
    runs-on: macos-26

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # Select Xcode via the standard action rather than a hardcoded path, which
      # breaks whenever the runner image rotates its installed Xcodes. The version
      # is a range so a patch bump (26.5.0 → 26.5.1) doesn't fail the build; widen
      # to '26' or 'latest-stable' if you want to always track the newest.
      # 26.5 minimum: 26.4's generated resource_bundle_accessor.swift doesn't
      # compile under defaultIsolation(MainActor.self) (Presentation package).
      - name: Select Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: '26.5'

      - name: Show versions
        run: |
          swift --version
          xcodebuild -version

      # SwiftFormat, SwiftLint, and xcbeautify are preinstalled on macos-26.
      # Install only what might be missing (XcodeGen) and skip the rest.
      - name: Install XcodeGen
        run: brew install xcodegen swiftformat swiftlint

      # The preinstalled SwiftFormat version varies between runner images, and
      # `brew install` is a no-op when one is present, so the format check would
      # otherwise depend on which image the job lands on. Pin the exact release
      # the sources are formatted with and put it ahead of the image's copy.
      - name: Install pinned SwiftFormat
        env:
          SWIFTFORMAT_VERSION: 0.63.0
          SWIFTFORMAT_SHA256: 28c7802e11fa5ae113d903066439c6bb1be20a8ac1ad9709c42616a7e273fb0f
        run: |
          curl -fsSL -o swiftformat.zip \
            "https://github.com/nicklockwood/SwiftFormat/releases/download/${SWIFTFORMAT_VERSION}/swiftformat.zip"
          echo "${SWIFTFORMAT_SHA256}  swiftformat.zip" | shasum -a 256 -c -
          mkdir -p "${RUNNER_TEMP}/swiftformat"
          unzip -o -q swiftformat.zip -d "${RUNNER_TEMP}/swiftformat"
          rm swiftformat.zip
          echo "${RUNNER_TEMP}/swiftformat" >> "$GITHUB_PATH"

      - name: Check formatting
        run: |
          which swiftformat
          swiftformat --version
          make format-check

      - name: Lint
        run: make lint

      - name: Generate Xcode project
        run: make generate

      - name: Test packages
        run: make test

      - name: Build app
        run: make build DESTINATION='platform=iOS Simulator,name=iPhone 17'

