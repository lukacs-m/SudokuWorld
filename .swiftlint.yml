# SwiftLint configuration — https://github.com/realm/SwiftLint
# Run via `make lint`.

# Lint the package sources and the app target; skip build artifacts.
included:
  - Packages
  - App

excluded:
  - "**/.build"
  - .build
  - DerivedData
  - "**/*.generated.swift"
  - "**/Tests/**"          # don't lint test files
  - "**/Package.swift"     # don't lint package manifests
  - "Templates"            # Xcode templates use ___PLACEHOLDER___ syntax

# Opt-in rules worth having on a clean codebase.
#opt_in_rules:
#  - empty_count
#  - empty_string
#  - first_where
#  - last_where
#  - contains_over_first_not_nil
#  - sorted_first_last
#  - redundant_nil_coalescing
#  - toggle_bool
#  - unused_import
#  - explicit_init
#  - closure_spacing
#  - operator_usage_whitespace
#  - vertical_whitespace_closing_braces

  ##############
#Disabled rules#
##############

disabled_rules:
 - no_magic_numbers
 - multiline_arguments_brackets
 - contrasted_opening_brace
 - no_extension_access_modifier
 - file_header
 - explicit_acl
 - indentation_width
 - no_grouping_extension
 - one_declaration_per_file
 - explicit_type_interface
 - explicit_top_level_acl
 - type_contents_order
 - attributes
 - multiline_parameters_brackets
 - closure_body_length
 - required_deinit
 - file_types_order
 - missing_docs
 - conditional_returns_on_newline
 - private_subject
 - sorted_enum_cases
 - file_name
 - explicit_enum_raw_value
 - anonymous_argument_in_multiline_closure
 - no_empty_block
 - function_default_parameter_at_end
 - switch_case_on_newline
 - discouraged_optional_collection
 - incompatible_concurrency_annotation
 - todo                    # TODO/FIXME comments are fine during development
 - trailing_comma          # SwiftFormat owns comma style
 - opening_brace           # SwiftFormat owns brace placement (wrapped guards)
 - discouraged_default_parameter # convenience defaults are deliberate API design here (stdlib style)
 - redundant_string_enum_value   # conflicts with raw_value_for_camel_cased_codable_enum: persisted
                                 # Codable enums pin raw values explicitly so renames can't break saves
 - number_separator          # SwiftFormat owns numeric grouping (decimalgrouping)
 - closure_end_indentation   # SwiftFormat owns indentation (like indentation_width)
 - vertical_whitespace_between_cases # SwiftFormat owns blank-line layout and strips these
 - modifier_order            # SwiftFormat's modifierOrder enforces the opposite order

##############
#Opted in rules#
##############

opt_in_rules:
  - all

##############
#Specific analyzer rules#
##############

analyzer_rules: # Rules run by `swiftlint analyze`
  - explicit_self
  - unused_declaration
  - unused_import

line_length:
  warning: 100
  error: 140
  ignores_comments: true
  ignores_urls: true

type_body_length:
  warning: 300
  error: 400

# SwiftLint counts each switch case toward complexity, so exhaustive
# variant registries (the codebase's compile-time totality pattern) trip a
# threshold of 10 constantly; 15 still catches genuinely tangled logic.
cyclomatic_complexity:
  warning: 15
  error: 20

# Canvas drawing and topology construction are naturally 50–70 linear
# lines; the error threshold still catches real monsters.
function_body_length:
  warning: 70
  error: 100

# Engine internals legitimately pass (context, solution, target, grader,
# inout rng) plus one specific — the inout rng cannot be bundled away.
function_parameter_count:
  warning: 6
  error: 8

file_length:
  warning: 500
  error: 700
  ignore_comment_only_lines: true

# Allow short, conventional identifiers (id, vm, di, x in closures, etc.).
# `a`/`b` are RelationClue's endpoints — public API whose names are also the
# persisted JSON keys, so they cannot be renamed.
identifier_name:
  min_length: 2
  excluded:
    - id
    - vm
    - di
    - x
    - y
    - a
    - b

# "master" is the top puzzle difficulty — a frozen persistence slug baked
# into Game Center leaderboard IDs, so it cannot be renamed.
inclusive_language:
  override_allowed_terms:
    - master

# Don't flag the example/reference types or generated code.
nesting:
  type_level: 2
